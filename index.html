<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2ff">
<title>진로상담 분석 — newPrjt02</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-gradient: linear-gradient(140deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
        --card-bg: rgba(255, 255, 255, 0.62);
        --card-border: rgba(255, 255, 255, 0.85);
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent-primary: #6366f1;
        --accent-secondary: #4f46e5;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: light;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: background-color .25s ease, border-color .25s ease,
                    color .25s ease, box-shadow .25s ease, transform .25s var(--ease);
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Pretendard', -apple-system, sans-serif;
        background: var(--bg-gradient);
        background-attachment: fixed;
        position: relative;
        overflow-x: hidden;
    }

    body::before, body::after {
        content: '';
        position: fixed;
        width: 46vmax; height: 46vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .55;
        z-index: 0;
        pointer-events: none;
        animation: float 14s ease-in-out infinite alternate;
    }
    body::before { background: radial-gradient(circle, #c7d2fe 0%, transparent 70%); top: -14vmax; left: -12vmax; }
    body::after  { background: radial-gradient(circle, #a5f3fc 0%, transparent 70%); bottom: -16vmax; right: -12vmax; animation-delay: -7s; }

    @keyframes float {
        from { transform: translate3d(0,0,0) scale(1); }
        to   { transform: translate3d(2vmax,3vmax,0) scale(1.08); }
    }

    .card {
        position: relative;
        z-index: 1;
        background: var(--card-bg);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, .10),
                    inset 0 1px 0 rgba(255, 255, 255, .75);
        padding: 56px 64px;
        text-align: center;
        animation: rise .6s var(--ease) both;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(14px) scale(.985); }
        to   { opacity: 1; transform: none; }
    }

    .badge {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-primary);
        margin-bottom: 20px;
        animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .4; transform: scale(1.3); }
    }

    h1 {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.3px;
        color: var(--text-primary);
    }

    p {
        margin-top: 12px;
        font-size: 0.95rem;
        line-height: 1.7;
        color: var(--text-secondary);
    }

    .lead { max-width: 34rem; margin-left: auto; margin-right: auto; }

    /* 3단계 흐름 — 이 앱이 무엇인지 한눈에 보이는 것이 이 화면의 전부다 */
    .flow {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 26px;
        text-align: left;
    }

    .flow div {
        background: rgba(255, 255, 255, .72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.55;
        color: var(--text-primary);
    }

    .flow b {
        display: block;
        font-family: 'Outfit', sans-serif;
        font-size: 11.5px;
        font-weight: 800;
        color: var(--accent-secondary);
        margin-bottom: 3px;
    }

    @media (max-width: 620px) {
        .card { padding: 40px 28px; }
        .flow { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, body::before, body::after {
            animation: none !important;
            transition-duration: .01ms !important;
        }
    }
</style>
</head>
<body>
    <div class="card">
        <span class="badge"></span>
        <h1>진로상담 분석</h1>
        <p class="lead">
            중·고 진로교사를 위한 <b>1차 진로·산업·진학 리서치</b>와
            <b>2차 진로 가설 분석</b>.<br>
            이 앱은 AI 를 대신 부르지 않습니다 —
            <b>프롬프트를 만들어 주고, 받은 결과를 보관</b>합니다.
        </p>

        <div class="flow">
            <div><b>STEP 1</b>학생 정보 입력 → 프롬프트 복사</div>
            <div><b>STEP 2</b>원하는 AI 화면에 붙여넣고 실행</div>
            <div><b>STEP 3</b>AI 결과 붙여넣기</div>
        </div>

        <p style="margin-top:26px">
            <a href="career.html" style="display:inline-block;padding:12px 26px;font-weight:700;
               font-size:15px;color:#fff;text-decoration:none;border-radius:13px;
               background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));
               box-shadow:0 8px 20px rgba(99,102,241,.30)">시작하기</a>
        </p>
        <p style="margin-top:14px;font-size:12px">
            로그인이 필요합니다. 계정은 이 브라우저에만 저장되는 <b>테스트용 데모</b>입니다.
        </p>
    </div>
</body>
</html>
