<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2ff">
<title>1차 AI 분석결과 붙여넣기 — newPrjt02</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/auth.css">
<link rel="stylesheet" href="assets/career.css">
</head>
<body class="doc">

<div class="doc-wrap">

    <div class="doc-head">
        <span class="logo">🧭</span>
        <h1>1차 AI 분석결과 붙여넣기</h1>
        <span class="who" id="whoami">—</span>
    </div>

    <div class="steps">
        <div class="step"><span class="n">STEP 1</span><span class="t">학생 정보 입력 → 프롬프트 복사</span></div>
        <div class="step"><span class="n">STEP 2</span><span class="t">AI 화면에 붙여넣고 실행</span></div>
        <div class="step on"><span class="n">STEP 3</span><span class="t">AI 분석결과 붙여넣기</span></div>
    </div>

    <div class="panel">
        <h2 id="caseTitle">사례</h2>
        <p class="sub">
            아래에 붙여넣으십시오. 마지막 면책 문장까지 들어와야 온전한 보고서입니다.
        </p>
        <div class="field">
            <textarea id="pasted" rows="10" placeholder="여기에 붙여넣기 (Ctrl+V)"></textarea>
            <p class="note" id="pasteInfo">아직 입력이 없습니다.</p>
            <div class="check" id="check" hidden></div>
        </div>
        <div class="btn-row">
            <button type="button" class="btn btn-primary grow" id="saveBtn" disabled>저장하기</button>
        </div>
    </div>

    <div class="panel" id="savedPanel" hidden>
        <h2>저장된 1차 결과</h2>
        <p class="sub" id="savedMeta"></p>
        <div class="btn-row" style="margin-top:0;margin-bottom:14px">
            <button type="button" class="btn btn-ghost" id="mdBtn">md 파일로 저장</button>
            <button type="button" class="btn btn-ghost" id="copyBtn">결과 복사</button>
        </div>
        <div class="report" id="report"></div>
    </div>

    <div class="btn-row">
        <a class="btn btn-primary grow" id="nextBtn" href="#" hidden>2차 추가정보 입력 →</a>
        <a class="btn btn-ghost" id="backBtn" href="#">← 1차 입력으로</a>
        <a class="btn btn-ghost" href="career.html">처음으로</a>
    </div>

</div>

<div class="toast" id="toast"></div>

<script src="assets/auth.js"></script>
<script src="assets/career.js"></script>
<script>
(function () {
    'use strict';
    if (!Career.mountChrome()) { return; }

    var id = new URLSearchParams(location.search).get('case');
    var kase = id && Career.getCase(id);
    if (!kase) {
        Career.toast('사례를 찾을 수 없습니다. 목록으로 돌아갑니다.', 'error');
        setTimeout(function () { location.href = 'career.html'; }, 1500);
        return;
    }
    document.getElementById('caseTitle').textContent = kase.label;
    document.getElementById('backBtn').href = 'career-step1.html?case=' + encodeURIComponent(kase.id);
    document.getElementById('nextBtn').href = 'career-step2.html?case=' + encodeURIComponent(kase.id);

    var ta = document.getElementById('pasted');

    function renderSaved() {
        kase = Career.getCase(kase.id);
        var rep = kase.report1;
        var panel = document.getElementById('savedPanel');
        if (!rep) { panel.hidden = true; return; }
        panel.hidden = false;
        document.getElementById('nextBtn').hidden = false;   /* 1차가 있어야 2차가 의미를 갖는다 */
        document.getElementById('savedMeta').textContent =
            new Date(rep.at).toLocaleString('ko-KR') + ' 저장 · ' +
            rep.chars.toLocaleString() + '자 · 붙여넣기';
        document.getElementById('report').innerHTML = Career.mdToHtml(rep.md);
    }

    var ROUND = 1;

    /* 붙여넣은 보고서가 끝까지 왔는지 본다.
       자동 호출 시절엔 프록시의 이어쓰기가 잘림을 막았다. 지금은 사람이 스크롤 중간에서
       복사하거나 전체 선택에 실패해 같은 결과가 난다 — 그래서 이 검사가 더 중요하다.
       ⚠ 경고가 떠도 저장은 막지 않는다. 판단은 사용자 몫이다. */
    function renderCheck(text) {
        var box = document.getElementById('check');
        if (!text.trim()) { box.hidden = true; return null; }

        var r = Career.checkReport(text, ROUND);
        box.hidden = false;
        box.className = 'check ' + (r.problems.length ? 'warn' : 'ok');

        var head = document.createElement('div');
        head.className = 'head';
        head.textContent = r.problems.length
            ? ('완결성 검사 — 확인할 점 ' + r.problems.length + '건')
            : '완결성 검사 — 이상 없음';

        var ul = document.createElement('ul');
        r.problems.forEach(function (m) {
            var li = document.createElement('li'); li.textContent = m; ul.appendChild(li);
        });
        r.passes.forEach(function (m) {
            var li = document.createElement('li'); li.className = 'pass';
            li.textContent = m; ul.appendChild(li);
        });

        box.innerHTML = '';
        box.appendChild(head);
        box.appendChild(ul);
        return r;
    }

    function info() {
        var n = ta.value.trim().length;
        document.getElementById('pasteInfo').textContent =
            n ? (n.toLocaleString() + '자 입력됨') : '아직 입력이 없습니다.';
        document.getElementById('saveBtn').disabled = !n;
        renderCheck(ta.value);
    }
    ta.addEventListener('input', info);

    document.getElementById('saveBtn').addEventListener('click', function () {
        try {
            var chk = Career.checkReport(ta.value, ROUND);
            var rec = Career.saveReport(kase.id, 1, ta.value);
            Career.toast(rec.chars.toLocaleString() + '자를 저장했습니다.' +
                (chk.problems.length
                    ? ' ⚠ 완결성 확인 ' + chk.problems.length + '건 — ' + chk.problems[0]
                    : ''),
                chk.problems.length ? '' : 'ok');
            ta.value = '';
            info();
            document.getElementById('check').hidden = true;
            renderSaved();
            document.getElementById('savedPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) {
            Career.toast(e.message, 'error');
            ta.focus();
        }
    });

    document.getElementById('mdBtn').addEventListener('click', function () {
        Career.downloadMd(kase, 1, Career.getCase(kase.id).report1.md);
    });

    document.getElementById('copyBtn').addEventListener('click', function () {
        Career.copyText(Career.getCase(kase.id).report1.md)
            .then(function () { Career.toast('결과를 복사했습니다.', 'ok'); })
            .catch(function (e) { Career.toast(e.message, 'error'); });
    });

    info();
    renderSaved();
})();
</script>
</body>
</html>
