<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2ff">
<title>2차 결과 붙여넣기 — newPrjt02</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/auth.css">
<link rel="stylesheet" href="assets/career.css">
</head>
<body class="doc">

<div class="doc-wrap">

    <div class="doc-head">
        <span class="logo">🧭</span>
        <h1>2차 결과 붙여넣기</h1>
        <span class="who" id="whoami">—</span>
    </div>

    <div class="steps">
        <div class="step"><span class="n">STEP 1</span><span class="t">추가정보 입력 → 프롬프트 복사</span></div>
        <div class="step"><span class="n">STEP 2</span><span class="t">AI 화면에 붙여넣고 실행</span></div>
        <div class="step on"><span class="n">STEP 3</span><span class="t">2차 결과를 되돌려 넣기</span></div>
    </div>

    <div class="panel">
        <h2 id="caseTitle">사례</h2>
        <p class="sub">
            AI 가 만든 2차 분석 md 를 <strong>처음부터 끝까지</strong> 복사해 붙여넣으십시오.
            STEP 11 최종 브리프와 마지막 면책 문장까지 들어와야 온전한 보고서입니다.
        </p>
        <div class="field">
            <label for="pasted">2차 분석 결과 (마크다운)</label>
            <textarea id="pasted" rows="10" placeholder="여기에 붙여넣기 (Ctrl+V)"></textarea>
            <p class="note" id="pasteInfo">아직 입력이 없습니다.</p>
        </div>
        <div class="btn-row">
            <button type="button" class="btn btn-primary grow" id="saveBtn">저장하기</button>
            <button type="button" class="btn btn-ghost" id="clearBtn">지우기</button>
        </div>
    </div>

    <div class="panel" id="savedPanel" hidden>
        <h2>저장된 2차 결과</h2>
        <p class="sub" id="savedMeta"></p>
        <div class="btn-row" style="margin-top:0;margin-bottom:14px">
            <button type="button" class="btn btn-ghost" id="mdBtn">md 파일로 저장</button>
            <button type="button" class="btn btn-ghost" id="bothBtn">1·2차 합본 저장</button>
            <button type="button" class="btn btn-ghost" id="copyBtn">결과 복사</button>
        </div>
        <div class="report" id="report"></div>
    </div>

    <div class="btn-row">
        <a class="btn btn-ghost" id="backBtn" href="#">← 2차 입력으로</a>
        <a class="btn btn-ghost" href="career.html">사례 목록</a>
    </div>

</div>

<div class="toast" id="toast"></div>

<script src="assets/auth.js"></script>
<script src="assets/career.js"></script>
<script>
(function () {
    'use strict';
    if (!Career.mountChrome()) { return; }

    var id = new URLSearchParams(location.search).get('case');
    var kase = id && Career.getCase(id);
    if (!kase) {
        Career.toast('사례를 찾을 수 없습니다. 목록으로 돌아갑니다.', 'error');
        setTimeout(function () { location.href = 'career.html'; }, 1500);
        return;
    }
    document.getElementById('caseTitle').textContent = kase.label;
    document.getElementById('backBtn').href = 'career-step2.html?case=' + encodeURIComponent(kase.id);

    var ta = document.getElementById('pasted');

    function renderSaved() {
        kase = Career.getCase(kase.id);
        var rep = kase.report2;
        var panel = document.getElementById('savedPanel');
        if (!rep) { panel.hidden = true; return; }
        panel.hidden = false;
        document.getElementById('savedMeta').textContent =
            new Date(rep.at).toLocaleString('ko-KR') + ' 저장 · ' +
            rep.chars.toLocaleString() + '자 · 붙여넣기';
        document.getElementById('report').innerHTML = Career.mdToHtml(rep.md);
        /* 합본은 1차가 있어야 만들 수 있다 — 없으면 버튼을 눌러 볼 수 없게 한다 */
        document.getElementById('bothBtn').disabled = !kase.report1;
    }

    function info() {
        var n = ta.value.trim().length;
        document.getElementById('pasteInfo').textContent =
            n ? (n.toLocaleString() + '자 입력됨') : '아직 입력이 없습니다.';
    }
    ta.addEventListener('input', info);

    document.getElementById('saveBtn').addEventListener('click', function () {
        try {
            var rec = Career.saveReport(kase.id, 2, ta.value);
            Career.toast(rec.chars.toLocaleString() + '자를 저장했습니다.', 'ok');
            ta.value = '';
            info();
            renderSaved();
            document.getElementById('savedPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) {
            Career.toast(e.message, 'error');
            ta.focus();
        }
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
        ta.value = ''; info(); ta.focus();
    });

    document.getElementById('mdBtn').addEventListener('click', function () {
        Career.downloadMd(kase, 2, Career.getCase(kase.id).report2.md);
    });

    document.getElementById('bothBtn').addEventListener('click', function () {
        try { Career.downloadCombined(kase); Career.toast('1·2차 합본을 저장했습니다.', 'ok'); }
        catch (e) { Career.toast(e.message, 'error'); }
    });

    document.getElementById('copyBtn').addEventListener('click', function () {
        Career.copyText(Career.getCase(kase.id).report2.md)
            .then(function () { Career.toast('결과를 복사했습니다.', 'ok'); })
            .catch(function (e) { Career.toast(e.message, 'error'); });
    });

    info();
    renderSaved();
})();
</script>
</body>
</html>
